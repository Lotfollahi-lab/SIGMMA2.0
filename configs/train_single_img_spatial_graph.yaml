model:
  name: single_img_spatial_graph
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/img_spatial_alignment/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/
  image_encoder_input_dim: 1024
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 4952 # cell vector dimension from pretrained model (novae: 64, nemo: 384) or raw cell vector dimension (e.g. 4624)
  spatial_encoder_output_dim: 512
  num_cell_types: 84
  temperature: 0.01
  dropout: 0.1
  activation: 'leaky_relu'
  aggregate: 'max'
  
dataset:
  split_type: 'section_split'
  train:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/MANIFEST_train.csv
    num_cell_types: 84
    fov_size: 256
  validation:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/MANIFEST_val.csv
    num_cell_types: 84
    fov_size: 256
  
train:
  batch_size: 128
  epochs: 100
  learning_rate: 0.000001
  weight_decay: 0.00001
  lr_step_size: 10
  lr_gamma: 0.1
  save_every: 100
  eval_every: 100
  gradient_accumulation_steps: 20
  num_workers: 16