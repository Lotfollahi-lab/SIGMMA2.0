model:
  name: basic_contrastive_model
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/img_spatial_alignment/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/
  image_encoder_output_dim: 1024
  spatial_encoder_output_dim: 64
  projection_dim: 128
  num_cell_types: 20
  infoNCE_temperature: 0.01
  
dataset1:
  image_file: /nfs/team361/dj16/data/Xenium_Prime_Human_Breast_Cancer_FFPE/image.zarr/
  spatial_file: /nfs/team361/dj16/data/Xenium_Prime_Human_Breast_Cancer_FFPE/spatial_preprocessed_breast_cancer.h5
  indices_file: /nfs/team361/dj16/data/Xenium_Prime_Human_Breast_Cancer_FFPE/indices.zarr/
  fov_size: 256

dataset2:
  image_file: /nfs/team361/dj16/data/Xenium_Prime_Human_Lung_Cancer_FFPE/image.zarr
  spatial_file: /nfs/team361/dj16/data/Xenium_Prime_Human_Lung_Cancer_FFPE/spatial_preprocessed_lung_cancer.h5
  indices_file: /nfs/team361/dj16/data/Xenium_Prime_Human_Lung_Cancer_FFPE/indices.zarr/
  fov_size: 256
  
outdir: /nfs/team361/dj16/img_spatial_alignment/outputs/basic_contrastive

train:
  batch_size: 128
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_step_size: 10
  lr_gamma: 0.1
  save_every: 5000
  eval_every: 5000
  gradient_accumulation_steps: 40