model:
  name: sigmma
  # Full-rerun ckpt (job 36852): dense attn-pool + GEX-aware SVG loss (a01).
  # Smoke test on HEST-1k SKCM (TENX115/TENX117) — checkpoint_path + manifest swap
  # only; ST encoder consumes 384-d nemo cell embedding regardless of gene panel.
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/sigmma_outputs/checkpoints/sigmma_dense_attnpool_gex_svg_a01/36852/checkpoint-step2000.pth
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/SIGMMA/assets/ckpts/uni_h/
  image_encoder_input_dim: 1536
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  contrastive_temperature: 0.07
  gumbel_temperature: 0.5
  edge_threshold: 0.5
  candidate_top_k: 8
  candidate_sim_threshold: 0.5
  dropout: 0.1
  activation: "leaky_relu"
  aggregate: "attn_pool"
  num_graph_layers: 2
  image_mlp_hidden_dim: 2048
  image_attn_pool_heads: 8
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["qkv", "proj"]
    bias: "none"
    per_scale: false

dataset:
  split_type: "section_split"
  query_dataset:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_adrenocortical_carcinoma_MANIFEST_test.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: "nemo"
    fov_size: 256

test:
  batch_size: 256
  num_workers: 16
