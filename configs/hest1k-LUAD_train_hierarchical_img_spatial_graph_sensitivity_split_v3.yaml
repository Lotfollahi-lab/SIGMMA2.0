model:
  name: hierarchical_img_spatial_graph
  # image encoder dim: 1024 for UNI, 1536 for H-optimus_zero, 2048 for ResNet50
  # pretrained_image_encoder: ResNet50
  # image_encoder_input_dim: 2048
  # --------
  # pretrained_image_encoder: H-optimus_zero
  # image_encoder_input_dim: 1536
  # --------
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/img_spatial_alignment/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/
  image_encoder_input_dim: 1024
  # --------
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384 # cell vector dimension from pretrained model (novae: 64, nemo: 384, 768 for NEMO v2) or raw cell vector dimension (e.g. 4952)
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  num_cell_types: 84
  temperature: 0.01
  dropout: 0.1
  activation: 'leaky_relu'
  aggregate: 'attn_pool'
  num_graph_layers: 2

dataset:
  split_type: 'pooled_FOV_split'
  split_version: 'v3'
  manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/public_xenium/MANIFEST_hest_1k_LUAD.csv 
  pretrained_cell_embedding: True 
  type_pretrained_cell_embedding: 'nemo'
  num_cell_types: 84
  fov_size: 256
  tissue_filtering_threshold: 0

train:
  batch_size: 128
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.001
  lr_scheduler: "step"
  lr_step_size: 100
  lr_gamma: 0.1
  save_every: 10
  eval_every: 10
  gradient_accumulation_steps: 10
  num_workers: 16