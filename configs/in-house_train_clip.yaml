model:
  name: openAI_CLIP
  hf_model_id: "openai/clip-vit-base-patch32"
  contrastive_temperature: 0.07
  pretrained_image_encoder: "clip-vit-base-patch32"

dataset:
  split_type: "section_split"
  train:
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: "nemo"
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_MANIFEST_train.csv
    fov_size: 256
  validation:
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: "nemo"
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_MANIFEST_val.csv
    fov_size: 256

train:
  batch_size: 128
  max_steps: 1000
  learning_rate: 0.00001
  weight_decay: 0.001
  lr_scheduler: "step"
  lr_step_size: 50
  lr_gamma: 0.1
  save_every: 100
  eval_every: 100
  max_num_eval_samples: 2048
  # CLIP/PLIP/OmiCLIP forward returns a single tensor pair (no per-scale list);
  # the gradient-accumulation branch in train_utils.train() is sigmma-only,
  # so accumulation must stay disabled.
  gradient_accumulation_steps: 1
  num_workers: 15
