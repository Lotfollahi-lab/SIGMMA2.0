model:
  name: PLIP
  temperature: 0.01

dataset:
  split_type: 'section_split'
  reference_dataset:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_beacon_MANIFEST.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: 'nemo'
    num_cell_types: 84
    fov_size: 256

  query_dataset:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_beacon_MANIFEST_test.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: 'nemo'
    num_cell_types: 84
    fov_size: 256

test:
  batch_size: 256
  num_samples: 100
  num_workers: 16