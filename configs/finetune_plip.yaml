model:
  name: PLIP
  temperature: 0.01

dataset:
  manifest_path: /nfs/team361/dj16/data/sanger_in_house_xenium/MANIFEST.csv
  fov_size: 256
  
train:
  batch_size: 128
  epochs: 100
  learning_rate: 0.00001
  weight_decay: 0.00001
  lr_step_size: 10
  lr_gamma: 0.1
  save_every: 500
  eval_every: 500
  gradient_accumulation_steps: 20
  num_workers: 8
  max_num_samples_per_epoch: 5000 # Limit the number of samples for training