model:
  name: sigmma
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/img_spatial_alignment/outputs/in-house_sigmma_18067/checkpoint-step8.pth
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/img_spatial_alignment/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/
  image_encoder_input_dim: 1024
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  gumbel_temperature: 0.5
  edge_threshold: 0.5
  candidate_top_k: 8
  candidate_sim_threshold: 0.5
  dropout: 0.1
  activation: "leaky_relu"
  aggregate: "attn_pool"
  num_graph_layers: 2
  # Must match the LoRA setup of 18067 — three independent adapters
  # (scale_0, scale_1, scale_2) injected into UNI's qkv/proj. The per-scale
  # benchmark activates one adapter at a time before extracting features.
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["qkv", "proj"]
    bias: "none"
    per_scale: true
