model:
  name: hierarchical_img_spatial_graph
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/img_spatial_alignment/outputs/hierarchical_img_spatial_graph_696022/checkpoint-epoch29.pth
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/img_spatial_alignment/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/
  image_encoder_input_dim: 1024
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384 # cell vector dimension from pretrained model (novae: 64) or raw cell vector dimension (e.g. 4624)
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  num_cell_types: 84 # TODO: remove
  temperature: 0.01
  dropout: 0.1
  activation: 'leaky_relu'
  aggregate: 'attn_pool'
  num_graph_layers: 2

dataset:
  split_type: 'section_split'
  reference_dataset:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_beacon_MANIFEST.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: 'nemo'
    num_cell_types: 84
    fov_size: 256

  query_dataset:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_beacon_MANIFEST_test.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: 'nemo'
    num_cell_types: 84
    fov_size: 256

test:
  batch_size: 256
  num_samples: 100
  num_workers: 16