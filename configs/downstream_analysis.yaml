model:
  name: sigmma
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/img_spatial_alignment/outputs/in-house_sigmma_16314/checkpoint-step1500.pth
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/img_spatial_alignment/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/
  image_encoder_input_dim: 1024
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384 # cell vector dimension from pretrained model (novae: 64, nemo: 384) or raw cell vector dimension (e.g. 4952)
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  gumbel_temperature: 0.5
  edge_threshold: 0.5
  dropout: 0.1
  activation: "leaky_relu"
  aggregate: "attn_pool"
  num_graph_layers: 2

dataset:
  split_type: "pooled_FOV_split"
  manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/public_xenium/MANIFEST_hest_1k_PAAD.csv
  train:
    indices: /lustre/scratch126/cellgen/lotfollahi/dj16/data/public_xenium/hest1k-PAAD_train_indices.npy
  test:
    indices: /lustre/scratch126/cellgen/lotfollahi/dj16/data/public_xenium/hest1k-PAAD_test_indices.npy
  pretrained_cell_embedding: True
  type_pretrained_cell_embedding: "nemo"
  fov_size: 256
  tissue_filtering_threshold: 0

test:
  batch_size: 256
  num_workers: 16
