model:
  name: hierarchical_img_cellgraph
  checkpoint_path: /nfs/team361/dj16/projects/img_spatial_alignment/outputs/hierarchical_img_graph_651892/checkpoint-1500.pth
  reference_path: /nfs/team361/dj16/projects/img_spatial_alignment/outputs/reference_hierarchical_img_graph_193032/
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/img_spatial_alignment/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/
  image_encoder_input_dim: 1024
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 4624 # cell vector dimension from pretrained model (novae: 64) or raw cell vector dimension (e.g. 4624)
