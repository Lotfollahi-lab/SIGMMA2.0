model:
  name: basic_contrastive_model
  pretrained_image_encoder_ckpt_path: ../assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/
dataset:
  image_file: ../../data/Xenium_Prime_Human_Breast_Cancer_FFPE/images/
  spatial_file: ../../data/Xenium_Prime_Human_Breast_Cancer_FFPE/spatial_preprocessed_breast_cancer.h5
  indices_file: ../../data/Xenium_Prime_Human_Breast_Cancer_FFPE/indices/
  fov_size: 256
outdir: ./outputs/basic_contrastive
train:
  batch_size: 64
  epochs: 100
  learning_rate: 0.001
  weight_decay: 1e-4
  lr_step_size: 10
  lr_gamma: 0.1
eval:
  batch_size: 64