model:
  name: hierarchical_img_cellgraph
  image_encoder_input_dim: 1024
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 4624 # cell vector dimension from pretrained model (novae: 64) or raw cell vector dimension (e.g. 4624)
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  num_cell_types: 28
  temperature: 0.01
  dropout: 0.1
  activation: 'leaky_relu'
  aggregate: 'max'
  
dataset1:
  image_file: /lustre/scratch126/cellgen/lotfollahi/dj16/data/Xenium_Prime_Human_Lymph_Node_Reactive_FFPE/image.zarr/
  spatial_file: /lustre/scratch126/cellgen/lotfollahi/dj16/data/Xenium_Prime_Human_Lymph_Node_Reactive_FFPE/spatial_preprocessed_lymph_node.h5
  indices_file: /lustre/scratch126/cellgen/lotfollahi/dj16/data/Xenium_Prime_Human_Lymph_Node_Reactive_FFPE/indices.zarr/
  fov_size: 256

dataset2:
  image_file: /lustre/scratch126/cellgen/lotfollahi/dj16/data/Xenium_Prime_Ovarian_Cancer_FFPE_XRrun/image.zarr
  spatial_file: /lustre/scratch126/cellgen/lotfollahi/dj16/data/Xenium_Prime_Ovarian_Cancer_FFPE_XRrun/spatial_preprocessed_ovarian_cancer.h5
  indices_file: /lustre/scratch126/cellgen/lotfollahi/dj16/data/Xenium_Prime_Ovarian_Cancer_FFPE_XRrun/indices.zarr/
  fov_size: 256
  
train:
  batch_size: 512
  epochs: 200
  learning_rate: 0.00001
  weight_decay: 0.00001
  lr_step_size: 10
  lr_gamma: 0.1
  save_every: 100
  eval_every: 100
  gradient_accumulation_steps: 4
  num_workers: 16
  max_num_samples_per_epoch: 5000 # Limit the number of samples for training