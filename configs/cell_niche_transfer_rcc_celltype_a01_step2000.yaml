# Cell-TYPE label-transfer config for renal cell carcinoma (RCC), level_2 (10
# classes incl. Tumour epithelium vs Nephron epithelium — tumour-vs-normal).
# RCC is the ONLY cancer cohort with per-cell cell-type labels. Model block
# identical to cell_niche_transfer_whole_embryo_a01_step2000.yaml (SIGMMA a01
# full-rerun ckpt, job 36852 step2000). Data block opts into the config-driven
# label schema: match column `batch` (e.g. CV1-KID-0-FT-1), single
# level_2_cell_type label, raw µm→px at 0.5 µm/px. Pipeline verified end-to-end
# on CV1-KID-0-FO-1 (121,962 valid cells, 0 NaN). Serves data/uni/sigmma extract
# stages AND the baseline extractor (--niche_config); baselines ignore the model.
model:
  name: sigmma
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/sigmma_outputs/checkpoints/sigmma_dense_attnpool_gex_svg_a01/36852/checkpoint-step2000.pth
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/SIGMMA/assets/ckpts/uni_h/
  image_encoder_input_dim: 1536
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  contrastive_temperature: 0.07
  gumbel_temperature: 0.5
  edge_threshold: 0.5
  candidate_top_k: 8
  candidate_sim_threshold: 0.5
  dropout: 0.1
  activation: "leaky_relu"
  aggregate: "attn_pool"
  num_graph_layers: 2
  image_mlp_hidden_dim: 2048
  image_attn_pool_heads: 8
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["qkv", "proj"]
    bias: "none"
    per_scale: false

data:
  labels_h5ad: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_renal_cell_carcinoma/labels.h5ad
  evaluable_slides_csv: /nfs/team361/dj16/projects/SIGMMA/configs/cell_niche_evaluable_slides_rcc.csv
  sample_match_column: batch
  normalize_sample: false
  um_per_px: 0.5
  niche_labels:
    - {name: level_2_cell_type, column: level_2_cell_type}

extract:
  scale_sizes: [64, 128, 256]
  encoder_input: 224
  patch_size: 16
  batch_size: 32
  # RCC has ~2.0M labelled cells across 20 sections (~100k/slide, up to 230k).
  # Cap per slide, stratified by level_2_cell_type (seed 42), so the cell set is
  # ~skin-scale and feature extraction is tractable. The same cap is re-derived
  # deterministically by the baseline extractor.
  max_cells_per_slide: 50000
  subsample_seed: 42
