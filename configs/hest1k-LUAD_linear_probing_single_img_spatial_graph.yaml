model:
  name: single_img_spatial_graph 
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/img_spatial_alignment/outputs/hest1k-LUAD_single_img_spatial_graph_520841/checkpoint-epoch60.pth 
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/img_spatial_alignment/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/
  image_encoder_input_dim: 1024
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384 # cell vector dimension from pretrained model (novae: 64, nemo: 384) or raw cell vector dimension (e.g. 4952)
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  num_cell_types: 84
  temperature: 0.01
  dropout: 0.1
  activation: 'leaky_relu'
  aggregate: 'attn_pool'
  num_graph_layers: 2

dataset:
  split_type: 'pooled_FOV_split'
  manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/public_xenium/MANIFEST_hest_1k_LUAD.csv 
  train:
    indices: /lustre/scratch126/cellgen/lotfollahi/dj16/data/public_xenium/hest1k-LUAD_train_indices.npy
  test:
    indices: /lustre/scratch126/cellgen/lotfollahi/dj16/data/public_xenium/hest1k-LUAD_test_indices.npy
  pretrained_cell_embedding: True
  type_pretrained_cell_embedding: 'nemo'
  num_cell_types: 84
  fov_size: 256
  tissue_filtering_threshold: 0

test:
  batch_size: 256
  num_workers: 16