model:
  name: sigmma
  # SIGMMA checkpoint trained with lora.per_scale: true so the three adapters
  # scale_0/scale_1/scale_2 exist. Update once a stronger checkpoint lands.
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/sigmma_outputs/checkpoints/sigmma_dense_attnpool_gex_svg_a01/36852/checkpoint-step2000.pth
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/SIGMMA/assets/ckpts/uni_h/
  image_encoder_input_dim: 1536
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  gumbel_temperature: 0.5
  edge_threshold: 0.5
  candidate_top_k: 8
  candidate_sim_threshold: 0.5
  dropout: 0.1
  activation: "leaky_relu"
  aggregate: "attn_pool"
  num_graph_layers: 2
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["qkv", "proj"]
    bias: "none"
    per_scale: true

data:
  labels_h5ad: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_beacon/labels.h5ad
  evaluable_slides_csv: /nfs/team361/dj16/projects/SIGMMA/configs/cell_niche_evaluable_slides.csv

extract:
  # 64/128/256 px crops at 0.5 µm/px = 32/64/128 µm fields → micro/meso/macro
  # neighbourhoods. UNI ViT-L/16 takes 224 px input → 14 × 14 patch grid.
  scale_sizes: [64, 128, 256]
  encoder_input: 224
  patch_size: 16
  batch_size: 32
