[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sigmma"
version = "2.0.0"
description = "Spatial transcriptome–histology image representation learning via hierarchical graph-based multi-scale multi-modal alignment"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Dabin Jeong", email = "dnj01208@gmail.com" }]
requires-python = ">=3.11,<3.12"
keywords = ["spatial transcriptomics", "histopathology", "contrastive learning", "multimodal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core = what `import sigmma.*` needs. dgl >= 2.2 is not on PyPI (PyPI stops at
# 2.1, which lacks graphbolt for torch 2.3): install it from the DGL wheel
# index first (see README).
# Upper bounds below are forced by torch 2.3 / numpy 1.26:
#   pyarrow >= 20 requires numpy 2.
# anndata >= 0.12 is required because 0.11 refuses to load against zarr 3
# ("zarr-python major version > 2 is not supported").
dependencies = [
    "torch>=2.3,<2.4",
    "torchvision>=0.18,<0.19",
    "timm>=1.0",
    "dgl>=2.2",
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "ml-collections>=1.1,<2",
    "pyyaml>=6.0",
    "einops>=0.8,<0.9",
    "peft>=0.11,<1",
    # imported by peft; >= 4.58 (5.x) requires torch >= 2.6
    "transformers>=4.40,<4.58",
    "wandb>=0.20.1,<0.22",
    "umap-learn>=0.5.6",
    "matplotlib>=3.8",
    "pillow>=10",
    "anndata>=0.12,<0.13",
    "scanpy>=1.11.2,<2",
    "zarr>=3.1,<4",
    "numcodecs>=0.14",
    "h5py>=3.10,<4",
    "pyarrow>=14,<20",
    "scikit-image>=0.25,<0.26",
    "sympy>=1.12",
    # sigmma.evaluation.linear_probing* (imported by sigmma.evaluation/__init__)
    "xgboost>=3.0.5,<4.0.0",
]

[project.optional-dependencies]
# Downstream analysis used by scripts/ and notebooks/.
analysis = [
    "novae>=0.2.4,<0.3.0",
    "tifffile>=2025.5.26,<2026.0.0",
    "pot>=0.9.5,<0.10.0",
    "optuna>=4.3.0,<5.0.0",
    "gseapy>=1.1.9,<2.0.0",
    "xarray-dataclasses>=1.9.1,<2.0.0",
    "shapely>=2.0,<3.0",
    "gdown>=5.2.0,<6.0.0",
    "graphviz>=0.21,<0.22",
    "plotly>=6.5.2,<7.0.0",
    "scvi-tools>=1.4.2,<2.0.0",
    "kaiko-eva[vision]>=0.4.3,<0.5.0",
    "tensorboard>=2.20.0,<3.0.0",
    "asap>=2.0.0a8,<3.0.0",
    "adjusttext>=1.3.0,<2.0.0",
    "liana>=1.7.1,<2.0.0",
    "lifelines>=0.30.3,<0.31.0",
    "openslide-bin>=4.0.1.2,<5.0.0.0",
    "ipykernel>=6.29.5,<7.0.0",
]

[project.scripts]
sigmma-train = "sigmma.cli.train:main"
sigmma-retrieval = "sigmma.cli.retrieval:main"
sigmma-extract-embeddings = "sigmma.cli.extract_embeddings:main"

[project.urls]
Homepage = "https://github.com/Lotfollahi-lab/SIGMMA2.0"
Repository = "https://github.com/Lotfollahi-lab/SIGMMA2.0"

# ---------------------------------------------------------------------------
# Research environment (not part of the published package metadata).
# `uv sync` installs this group by default, reproducing the cluster env:
# all extras, exact pins, the CUDA dgl wheel, the benchmark baselines' deps
# and the local UNI/NicheJEPA/Loki checkouts.
# ---------------------------------------------------------------------------
[dependency-groups]
research = [
    "sigmma[analysis]",
    # sigmma/baselines (source repo only, not in the wheel)
    "open-clip-torch>=2.24",
    "torch==2.3.1",
    "dgl",
    "uni",
    "nichejepa",
    "loki",
    "zarr==3.1.0",
    "numcodecs==0.14",
]
release = [
    "build>=1.2",
    "twine>=6.1",
]

[tool.uv]
default-groups = ["research"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# loki pins anndata==0.10.9 but only calls var_names_make_unique(); the core
# needs anndata 0.12 for zarr 3.
override-dependencies = ["anndata>=0.12,<0.13"]

[tool.uv.sources]
dgl = { url = "https://data.dgl.ai/wheels-test/torch-2.3/cu121/dgl-2.5a241214%2Bcu121-cp311-cp311-manylinux1_x86_64.whl" }
uni = { path = "/nfs/team361/dj16/projects/img_spatial_alignment_dependencies/UNI" }
nichejepa = { path = "/nfs/team361/dj16/projects/img_spatial_alignment_dependencies/nichejepa" }
loki = { path = "/nfs/team361/dj16/projects/img_spatial_alignment_dependencies/Loki/src" }

[tool.hatch.build]
exclude = [
    # Benchmark baselines: third-party reimplementations kept in the repo
    # for reproducing the paper, not distributed.
    "sigmma/baselines",
    "**/__pycache__",
    "**/.ipynb_checkpoints",
    "**/.claude",
    "**/*.bak*",
    "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["sigmma"]

[tool.hatch.build.targets.sdist]
only-include = ["sigmma", "README.md", "LICENSE", "pyproject.toml"]
