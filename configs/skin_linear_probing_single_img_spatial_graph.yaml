model:
  name: single_img_spatial_graph
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/img_spatial_alignment/outputs/skin_single_img_spatial_graph_808315/checkpoint-epoch19.pth
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/img_spatial_alignment/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/
  image_encoder_input_dim: 1024
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384 # cell vector dimension from pretrained model (novae: 64, nemo: 384) or raw cell vector dimension (e.g. 4952)
  spatial_encoder_output_dim: 512
  num_cell_types: 84
  temperature: 0.01
  dropout: 0.3
  activation: 'leaky_relu'
  aggregate: 'attn_pool'
  num_graph_layers: 2

dataset:
  split_type: 'section_split'
  train:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_beacon_MANIFEST_train.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: 'nemo'
    num_cell_types: 84
    fov_size: 256

  test:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_beacon_MANIFEST_test.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: 'nemo'
    num_cell_types: 84
    fov_size: 256

test:
  batch_size: 256
  num_samples: 1000
  num_workers: 16