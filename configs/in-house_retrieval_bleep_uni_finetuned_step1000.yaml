model:
  name: BLEEP
  # Full-rerun fine-tuned BLEEP-UNI checkpoint (job 36858, corrected pipeline).
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/sigmma_outputs/checkpoints/baselines/in-house_train_bleep_uni/36858/checkpoint-step1000.pth
  spot_input_dim: 384            # nemo embedding dim
  image_embedding_dim: 1536      # UNI2-h ViT-H output (auto-overridden in BLEEP ctor)
  projection_dim: 256
  spot_hidden_dim: 512
  contrastive_temperature: 1.0
  dropout: 0.1
  image_size: 224
  pretrained_image_encoder_imagenet: False
  image_backbone: uni
  uni_ckpt_path: /nfs/team361/dj16/projects/SIGMMA/assets/ckpts/uni_h/

dataset:
  split_type: "section_split"
  query_dataset:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_MANIFEST_test.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: "nemo"
    fov_size: 256

test:
  batch_size: 128
  num_workers: 16
