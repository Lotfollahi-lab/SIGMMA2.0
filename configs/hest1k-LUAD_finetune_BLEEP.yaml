model:
  name: BLEEP
  temperature: 0.01

dataset:
  split_type: 'pooled_FOV_split'
  manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/public_xenium/MANIFEST_hest_1k_LUAD.csv 
  genes_to_keep: /lustre/scratch126/cellgen/lotfollahi/mm58/spatial_alignment/img_spatial_alignment/runs_bleep/LUAD_genes_to_keep.csv
  pretrained_cell_embedding: False
  type_pretrained_cell_embedding: None
  num_cell_types: 84
  fov_size: 256
  tissue_filtering_threshold: 0
  
train: # match BLEEP wherever possible
  batch_size: 512
  epochs: 150
  learning_rate: 0.001
  weight_decay: 0.00001
  lr_scheduler: "step"
  lr_step_size: 100
  lr_gamma: 0.1
  save_every: 10
  eval_every: 10
  gradient_accumulation_steps: 1
  num_workers: 0