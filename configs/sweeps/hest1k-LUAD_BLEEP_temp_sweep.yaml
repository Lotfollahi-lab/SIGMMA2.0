# Emergency fix: Temperature sweep
# Current issue: pos_gap is NEGATIVE - model prefers wrong pairs!
# Root cause: Temperature 0.07 may be too high

model:
  name: BLEEP
  temperature: 0.01  # MUCH LOWER - try 0.01, 0.03, 0.05, 0.07

dataset:
  split_type: 'pooled_FOV_split'
  manifest_path: /lustre/scratch126/cellgen/lotfollahi/mm58/spatial_alignment/public_xenium/hest_1k_LUAD/MANIFEST_hest_1k_LUAD.csv 
  pretrained_cell_embedding: True
  type_pretrained_cell_embedding: X_pca_harmony
  num_cell_types: 84
  fov_size: 256
  tissue_filtering_threshold: 0
  
train:
  batch_size: 1024
  epochs: 20  # Shorter for sweep
  learning_rate: 0.001
  weight_decay: 0.001
  lr_scheduler: "step"
  lr_step_size: 100
  lr_gamma: 0.1
  save_every: 5
  eval_every: 1  # Eval every epoch to catch issues early
  gradient_accumulation_steps: 1
  num_workers: 8

out_dir: /lustre/scratch126/cellgen/lotfollahi/mm58/spatial_alignment/img_spatial_alignment/runs_bleep/sweep_temp_0.01
