model:
  name: PLIP
  temperature: 0.01

dataset:
  manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/MANIFEST_train.csv
  num_cell_types: 84
  fov_size: 256
  
train:
  batch_size: 128
  epochs: 100
  learning_rate: 0.00001
  weight_decay: 0.00001
  lr_step_size: 10
  lr_gamma: 0.1
  save_every: 100
  eval_every: 100
  gradient_accumulation_steps: 20
  num_workers: 8