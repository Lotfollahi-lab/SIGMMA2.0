# EVA-critique inference config for SIGMMA no-LoRA ablation.
# Points at the existing legacy SIGMMA checkpoint that was trained WITHOUT
# LoRA (full UNI FT), step 1000 from job 16314.
#
# Note: 16314 used different hyperparams than the current LoRA SIGMMA
# (18328) — temperature 0.01 vs 0.07, lr_scheduler "step" vs warmup_cosine.
# Comparison should be treated as *suggestive*, not perfectly controlled.
# Job 21381 is training a clean no-LoRA twin of 18328 in parallel.

model:
  name: sigmma
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/SIGMMA/assets/ckpts/uni_h/
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/sigmma_outputs/checkpoints/sigmma/16314/checkpoint-step1000.pth
  image_encoder_input_dim: 1536
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  contrastive_temperature: 0.01
  gumbel_temperature: 0.5
  edge_threshold: 0.3
  dropout: 0.1
  activation: "leaky_relu"
  aggregate: "attn_pool"
  num_graph_layers: 2
  # No-LoRA: full UNI FT, weights shared across 3 scales.
  lora:
    enabled: false
