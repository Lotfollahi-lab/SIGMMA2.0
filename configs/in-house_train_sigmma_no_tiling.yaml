model:
  name: sigmma
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/SIGMMA/assets/ckpts/uni_h/
  image_encoder_input_dim: 1536
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  contrastive_temperature: 0.07
  gumbel_temperature: 0.5
  edge_threshold: 0.5
  candidate_top_k: 8
  candidate_sim_threshold: 0.5
  dropout: 0.1
  activation: "leaky_relu"
  aggregate: "attn_pool"
  num_graph_layers: 2
  # H2 ablation: disable sub-crop tiling on the image side. All 3 scales see
  # the same full FOV (1x1 grid); only LoRA adapters + projection heads
  # differentiate scales. Spatial side keeps its 3 graph readouts (micro,
  # meso, macro), so contrastive supervision is still hierarchical.
  image_tiling: false
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["qkv", "proj"]
    bias: "none"
    per_scale: true

dataset:
  split_type: "section_split"
  train:
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: "nemo"
    # Manifest excludes Sml4-PNC-0-FFPE-1-s4 (the one slide whose 2026-05-01
    # hier_cache went stale: 106 cached tiles vs 112 in the current dataset).
    # Dropping 2 rows preserves 258/260 train slides; cache is then usable.
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_MANIFEST_train_no_Sml4.csv
    fov_size: 256
    hier_cache_dir: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/sigmma_outputs/cache/hier_cache_fov256_res3_tt20000_2026_05_31
  validation:
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: "nemo"
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_MANIFEST_val.csv
    fov_size: 256
    hier_cache_dir: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/sigmma_outputs/cache/hier_cache_fov256_res3_tt20000_2026_05_31

train:
  batch_size: 128
  # Match SIGMMA per-scale ckpt step (job 18328 step 1000) used by EVA-critique.
  max_steps: 1000
  learning_rate: 0.0001
  weight_decay: 0.001
  lr_scheduler: "warmup_cosine"
  lr_warmup_steps: 50
  lr_min: 0.000001
  save_every: 500
  eval_every: 500
  max_num_eval_samples: 2048
  gradient_accumulation_steps: 10
  num_workers: 24
