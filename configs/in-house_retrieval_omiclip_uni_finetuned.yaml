model:
  name: loki_OmiCLIP
  # Loki's coca_ViT-L-14 weights used as initialization at fine-tuning time
  # (so the open_clip arch loads correctly); the fine-tuned weights override
  # via checkpoint_path below.
  pretrained_ckpt_path: /nfs/team361/dj16/projects/img_spatial_alignment/assets/ckpts/loki/checkpoint.pt
  image_backbone: uni
  uni_ckpt_path: /nfs/team361/dj16/projects/SIGMMA/assets/ckpts/uni_h/
  # Fine-tuned OmiCLIP-UNI checkpoint (job 21169).
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/sigmma_outputs/checkpoints/baselines/in-house_train_omiclip_uni/21169/checkpoint-step1000.pth

dataset:
  split_type: "section_split"
  query_dataset:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_MANIFEST_test.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: "nemo"
    fov_size: 256

test:
  batch_size: 128
  num_workers: 16
