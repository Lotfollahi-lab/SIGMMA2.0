model:
  name: openAI_CLIP
  hf_model_id: "openai/clip-vit-base-patch32"
  contrastive_temperature: 0.07
  # Controlled-backbone variant: swap CLIP visual -> UNI (full FT).
  image_backbone: uni
  uni_ckpt_path: /nfs/team361/dj16/projects/SIGMMA/assets/ckpts/uni_h/
  pretrained_image_encoder: "UNI"

dataset:
  split_type: "section_split"
  train:
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: "nemo"
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_MANIFEST_train.csv
    fov_size: 256
  validation:
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: "nemo"
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sanger_in_house_xenium/sanger_MANIFEST_val.csv
    fov_size: 256

train:
  # UNI ViT-L (303M) replaces CLIP ViT-B/32 (~88M); halve the batch to stay
  # within 76 GB GPU memory.
  batch_size: 128
  max_steps: 5000
  learning_rate: 0.00001
  weight_decay: 0.001
  lr_scheduler: "warmup_cosine"
  lr_warmup_steps: 50
  lr_min: 0.000001
  save_every: 500
  eval_every: 100
  max_num_eval_samples: 2048
  gradient_accumulation_steps: 1
  num_workers: 15
