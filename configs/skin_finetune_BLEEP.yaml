model:
  name: BLEEP
  # temperature: 0.01
  temperature: 0.1
  
dataset:
  split_type: 'section_split'
  pretrained_cell_embedding: True
  type_pretrained_cell_embedding: X_pca_harmony
  num_cell_types: 84
  fov_size: 256
  train:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/mm58/spatial_alignment/sanger_in_house_xenium/sanger_beacon_MANIFEST_train.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: X_pca_harmony
    num_cell_types: 84
    fov_size: 256
  validation:
    manifest_path: /lustre/scratch126/cellgen/lotfollahi/mm58/spatial_alignment/sanger_in_house_xenium/sanger_beacon_MANIFEST_val.csv
    pretrained_cell_embedding: True
    type_pretrained_cell_embedding: X_pca_harmony
    num_cell_types: 84
    fov_size: 256
  
train:
  batch_size: 128
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.00001
  lr_scheduler: "step"
  lr_step_size: 100
  lr_gamma: 0.1
  save_every: 10
  eval_every: 10
  gradient_accumulation_steps: 10
  num_workers: 8
