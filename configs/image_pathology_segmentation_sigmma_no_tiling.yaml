model:
  name: sigmma
  # Filled in after no-tiling SIGMMA training completes (step 1000).
  # job 22201/22220 EXITed/killed; job 22282 is the current submit (cache-on
  # with filtered manifest dropping Sml4-PNC-0-FFPE-1-s4).
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/sigmma_outputs/checkpoints/sigmma_no_tiling/22282/checkpoint-step1000.pth
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/SIGMMA/assets/ckpts/uni_h/
  image_encoder_input_dim: 1536
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  gumbel_temperature: 0.5
  edge_threshold: 0.5
  candidate_top_k: 8
  candidate_sim_threshold: 0.5
  dropout: 0.1
  activation: "leaky_relu"
  aggregate: "attn_pool"
  num_graph_layers: 2
  # H2 ablation: trained with image_tiling=false (all scales see full FOV).
  # LoRA per-scale identical to 18328 — 3 adapters scale_0/1/2 on qkv/proj.
  image_tiling: false
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["qkv", "proj"]
    bias: "none"
    per_scale: true
