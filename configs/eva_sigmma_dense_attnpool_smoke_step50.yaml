model:
  name: sigmma
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/sigmma_outputs/checkpoints/sigmma_dense_attnpool_smoke/23600/checkpoint-step50.pth
  pretrained_image_encoder: UNI
  pretrained_image_encoder_ckpt_path: /nfs/team361/dj16/projects/SIGMMA/assets/ckpts/uni_h/
  image_encoder_input_dim: 1536
  image_encoder_output_dim: 512
  spatial_encoder_input_dim: 384
  spatial_encoder_output_dim: 512
  num_resolutions: 3
  gumbel_temperature: 0.5
  edge_threshold: 0.5
  candidate_top_k: 8
  candidate_sim_threshold: 0.5
  dropout: 0.1
  activation: "leaky_relu"
  aggregate: "attn_pool"
  num_graph_layers: 2
  image_mlp_hidden_dim: 2048
  image_attn_pool_heads: 8
  # Matches the smoke training config — single shared LoRA adapter
  # (per_scale: false), so train_decoder will load wrapper as
  # `sigmma_no_lora` semantically (but scale_idx is irrelevant here).
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["qkv", "proj"]
    bias: "none"
    per_scale: false
