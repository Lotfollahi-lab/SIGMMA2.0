model:
  name: BLEEP
  temperature: 0.01

dataset:
  split_type: 'pooled_FOV_split'
  manifest_path: /lustre/scratch126/cellgen/lotfollahi/mm58/spatial_alignment/public_xenium/hest_1k_IDC/MANIFEST_hest_1k_IDC.csv 
  pretrained_cell_embedding: True
  type_pretrained_cell_embedding: X_pca_harmony
  num_cell_types: 84
  fov_size: 256
  tissue_filtering_threshold: 0
  
train: # match BLEEP wherever possible
  batch_size: 128
  epochs: 100
  learning_rate: 0.001 # 0.0001 works best with infoNCE
  weight_decay: 0.00001
  lr_scheduler: "step"
  lr_step_size: 100
  lr_gamma: 0.1
  save_every: 10
  eval_every: 10
  gradient_accumulation_steps: 10
  num_workers: 8
